<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Internship Details – internSarthi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white font-black rounded-xl w-9 h-9 flex items-center justify-center shadow-md shadow-indigo-600/30">
          iS
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900">internSarthi</span>
      </div>

      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="recommend.html" class="text-slate-600 hover:text-indigo-600 transition">Internships</a>
        <a href="skill_gap.html" class="text-slate-600 hover:text-indigo-600 transition">Learning Path</a>
        <a href="dashboard.html" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl transition shadow-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="max-w-4xl mx-auto px-4 py-8">

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 space-y-6">

      <!-- HEADER -->
      <div class="border-b border-slate-100 pb-6">
        <span id="role" class="inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-2"></span>
        <h1 id="title" class="text-3xl font-extrabold text-slate-900">Loading details...</h1>
        <p id="company" class="text-base font-semibold text-slate-500 mt-1"></p>
        <p id="location" class="text-sm text-slate-400 mt-0.5"></p>
      </div>

      <!-- KEY DETAILS CARDS -->
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
          <p class="text-xs font-semibold text-slate-400 uppercase">Start Date</p>
          <p id="start" class="font-bold text-slate-800 text-sm mt-1">-</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
          <p class="text-xs font-semibold text-slate-400 uppercase">Duration</p>
          <p id="duration" class="font-bold text-slate-800 text-sm mt-1">-</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
          <p class="text-xs font-semibold text-slate-400 uppercase">Stipend</p>
          <p id="stipend" class="font-bold text-slate-800 text-sm mt-1">-</p>
        </div>
      </div>

      <!-- REQUIRED SKILLS -->
      <div>
        <h3 class="text-sm font-bold text-slate-900 mb-2">Required Skills Overview</h3>
        <div id="skills" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- SKILL GAP MATCH -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6">
        <h3 class="text-base font-bold text-slate-900 mb-4">Skill Gap Analysis for You</h3>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <p class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">✓ Skills You Possess</p>
            <ul id="haveSkills" class="list-disc ml-5 text-sm text-slate-600 space-y-1"></ul>
          </div>

          <div>
            <p class="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-2">🚀 Skills to Acquire</p>
            <ul id="missingSkills" class="list-disc ml-5 text-sm text-slate-600 space-y-1"></ul>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex gap-4 pt-4 border-t border-slate-100">
        <button
          onclick="startInterview()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl text-sm shadow-md shadow-indigo-600/30 transition">
          Practice Role Interview
        </button>

        <a href="recommend.html" class="border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold px-6 py-3 rounded-xl text-sm transition">
          ← Back to List
        </a>
      </div>

    </div>

  </div>

  <script>
  window.addEventListener("DOMContentLoaded", async () => {
    const raw = localStorage.getItem("selected_internship");
    if (!raw) {
      document.body.innerHTML = "<div class='p-8 text-center text-slate-500'>No internship selected.</div>";
      return;
    }

    const { title, company } = JSON.parse(raw);

    try {
      const res = await fetch(
        `${API_BASE_URL}/internship-detail?title=${encodeURIComponent(title)}&company=${encodeURIComponent(company)}`
      );
      const data = await res.json();

      if (data.error) {
        document.body.innerHTML = "<div class='p-8 text-center text-slate-500'>Internship not found.</div>";
        return;
      }

      document.getElementById("title").innerText = data.internship_title;
      document.getElementById("company").innerText = data.company_name;
      document.getElementById("location").innerText = `📍 ${data.location}`;
      document.getElementById("role").innerText = data.internship_title;
      document.getElementById("start").innerText = data.start_date || "Flexible";
      document.getElementById("duration").innerText = data.duration || "Standard";
      document.getElementById("stipend").innerText = data.stipend || "Unpaid / Disclosed on interview";

      const userSkillsLower = (localStorage.getItem("user_skills") || "")
        .split(",")
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);

      const requiredSkillsOriginal = (data.required_skills || "")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      const requiredSkillsLower = requiredSkillsOriginal.map(s => s.toLowerCase());

      const skillsContainer = document.getElementById("skills");
      requiredSkillsOriginal.forEach(skill => {
        const chip = document.createElement("span");
        chip.className = "bg-slate-100 text-slate-700 text-xs px-3 py-1 rounded-xl font-medium border border-slate-200";
        chip.innerText = skill;
        skillsContainer.appendChild(chip);
      });

      const have = [];
      const missing = [];

      requiredSkillsOriginal.forEach((skill, index) => {
        if (userSkillsLower.includes(requiredSkillsLower[index])) {
          have.push(skill);
        } else {
          missing.push(skill);
        }
      });

      const haveList = document.getElementById("haveSkills");
      const missingList = document.getElementById("missingSkills");

      if (!have.length) {
        haveList.innerHTML = "<li class='text-xs text-slate-400 italic'>No matching skills yet</li>";
      } else {
        have.forEach(skill => {
          const li = document.createElement("li");
          li.innerText = skill;
          haveList.appendChild(li);
        });
      }

      if (!missing.length) {
        missingList.innerHTML = "<li class='text-xs text-emerald-600 font-semibold'>You have all required skills! 🎉</li>";
      } else {
        missing.forEach(skill => {
          const li = document.createElement("li");
          li.innerText = skill;
          missingList.appendChild(li);
        });
      }

    } catch (err) {
      console.error("Error fetching internship detail:", err);
    }
  });

  function startInterview() {
    const raw = localStorage.getItem("selected_internship");
    if (!raw) return;
    const { title } = JSON.parse(raw);
    localStorage.setItem("interview_role", title);
    window.location.href = "interview.html";
  }
  </script>

</body>
</html>
