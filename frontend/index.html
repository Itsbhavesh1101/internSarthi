<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>internSarthi – AI Internship Recommendation Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- MAIN CARD -->
  <div class="bg-white/10 backdrop-blur-xl border border-white/15 rounded-3xl shadow-2xl w-full max-w-lg p-8 md:p-10 transition-all">

    <!-- LOGO / TITLE -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center bg-indigo-600 text-white font-black text-2xl rounded-2xl w-14 h-14 mb-4 shadow-lg shadow-indigo-500/30">
        iS
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">
        internSarthi
      </h1>
      <p class="text-sm text-indigo-200 font-medium">
        AI-Powered Internship Guidance & Recommendation System
      </p>
    </div>

    <!-- FEATURE HIGHLIGHTS -->
    <div class="grid grid-cols-3 gap-2 mb-8 text-center">
      <div class="bg-white/5 border border-white/10 rounded-2xl p-3">
        <span class="text-lg block">🎯</span>
        <span class="text-xs text-indigo-200 font-medium">Smart Match</span>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl p-3">
        <span class="text-lg block">📊</span>
        <span class="text-xs text-indigo-200 font-medium">Skill Gap</span>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl p-3">
        <span class="text-lg block">🤖</span>
        <span class="text-xs text-indigo-200 font-medium">AI Interview</span>
      </div>
    </div>

    <!-- FORM -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1.5">
          Full Name
        </label>
        <input
          id="name"
          type="text"
          placeholder="e.g. Rahul Sharma"
          class="w-full rounded-2xl px-4 py-3.5 bg-slate-900/60 border border-white/15 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1.5">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          placeholder="e.g. rahul@example.com"
          class="w-full rounded-2xl px-4 py-3.5 bg-slate-900/60 border border-white/15 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm"
        />
      </div>
    </div>

    <!-- CONTINUE BUTTON -->
    <button
      onclick="continueToProfile()"
      class="w-full mt-8 bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-2xl font-bold text-sm tracking-wide shadow-xl shadow-indigo-600/40 active:scale-[0.99] transition flex items-center justify-center gap-2"
    >
      <span>Get Started</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </button>

    <!-- FOOTER -->
    <p class="text-xs text-center text-indigo-300/60 mt-6 font-medium">
      🔒 Free & Local • No account creation needed
    </p>

  </div>

  <script>
    function continueToProfile() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!name || !email) {
        alert("Please enter your name and email to proceed");
        return;
      }

      localStorage.setItem("user_name", name);
      localStorage.setItem("user_email", email);

      window.location.href = "profile.html";
    }
  </script>

</body>
</html>
